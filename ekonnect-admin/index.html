<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eKonnect Admin</title>
    <!-- Emblem on brand purple: the plain white mark would be invisible
         against a light browser tab. -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <!-- The hero photograph is the largest paint on the landing page, and
         it is discovered late because it lives inside the JS bundle's markup.
         Preloading it starts the download with the HTML instead. -->
    <link rel="preload" as="image" href="/assets/photos/hero-ambulance.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
